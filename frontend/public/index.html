<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B1A" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="CloudRead — a private reading room in your cloud. Read, request, and manage books from anywhere."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Inline theme bootstrap — applies dark mode before React mounts to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cloudread-theme');
          var resolved = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <title>CloudRead — A private reading room in your cloud</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
